<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px; margin: 0; background: #1e1e2e; color: #cdd6f4; }
    h3 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; color: #89b4fa; }
    input { width: 100%; padding: 8px; border: 1px solid #383850; border-radius: 4px; background: #252536; color: #fff; box-sizing: border-box; }
    #list { list-style: none; padding: 0; margin: 10px 0; max-height: 200px; overflow-y: auto; }
    li { padding: 8px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    li:hover { background: #383850; }
    li.loading { cursor: wait; color: #888; text-align: center; }
    li.empty { cursor: default; color: #888; text-align: center; }
    .status { font-size: 12px; color: #888; margin-top: 5px; text-align: right; }
  </style>
</head>
<body>
  <h3>Pass GUI Filler</h3>
  <input id="search" placeholder="Search..." autofocus>
  <ul id="list"></ul>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
